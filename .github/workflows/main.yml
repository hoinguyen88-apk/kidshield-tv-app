name: Build KidShield TV APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKM=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          fi

      - name: Prepare debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -noprompt \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build KidShield TV APK
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
        run: gradle assembleDebug --no-daemon --no-configuration-cache -Djava.awt.headless=true --stacktrace

      - name: Upload KidShield TV APK
        uses: actions/upload-artifact@v4
        with:
          name: KidShield-TV-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
